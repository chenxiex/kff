plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.chenxiex.kff'
    compileSdk 34
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'io.github.chenxiex.kff'
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
