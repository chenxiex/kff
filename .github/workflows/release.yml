name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and calculate version
        id: version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vX.Y.Z without leading zeros or suffixes" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( ${#major} > 4 || ${#minor} > 3 || ${#patch} > 3 )); then
            echo "Version components exceed the supported range" >&2
            exit 1
          fi
          if (( major > 2100 || minor > 999 || patch > 999 )); then
            echo "Version components exceed the supported range" >&2
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "versionCode must be between 1 and 2100000000" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi

          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        shell: bash
        env:
          KFF_KEYSTORE_BASE64: ${{ secrets.KFF_KEYSTORE_BASE64 }}
          KFF_STORE_PASSWORD: ${{ secrets.KFF_STORE_PASSWORD }}
          KFF_KEY_ALIAS: ${{ secrets.KFF_KEY_ALIAS }}
          KFF_KEY_PASSWORD: ${{ secrets.KFF_KEY_PASSWORD }}
        run: |
          for name in KFF_KEYSTORE_BASE64 KFF_STORE_PASSWORD KFF_KEY_ALIAS KFF_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

          key_file="$RUNNER_TEMP/kff-release.jks"
          printf '%s' "$KFF_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "KFF_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          KFF_RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          KFF_RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
          KFF_STORE_PASSWORD: ${{ secrets.KFF_STORE_PASSWORD }}
          KFF_KEY_ALIAS: ${{ secrets.KFF_KEY_ALIAS }}
          KFF_KEY_PASSWORD: ${{ secrets.KFF_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify and prepare APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          apk='app/build/outputs/apk/release/app-release.apk'
          tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"

          package_line="$("$tools/aapt" dump badging "$apk" | sed -n '1p')"
          if [[ "$package_line" != *"name='io.github.chenxiex.kff'"* ||
                "$package_line" != *"versionCode='$VERSION_CODE'"* ||
                "$package_line" != *"versionName='$VERSION_NAME'"* ]]; then
            echo "APK package or version does not match the release tag" >&2
            exit 1
          fi

          mkdir -p dist
          cp "$apk" "dist/kff-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/kff-${GITHUB_REF_NAME}.apk" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kff-release.jks"
