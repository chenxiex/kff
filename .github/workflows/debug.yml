name: Debug APK

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify Debug APK
        shell: bash
        run: |
          apk='app/build/outputs/apk/debug/app-debug.apk'
          tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          [[ -f "$apk" ]] || { echo "Debug APK not found: $apk" >&2; exit 1; }
          "$tools/apksigner" verify --verbose --print-certs "$apk"

          package_line="$("$tools/aapt" dump badging "$apk" | sed -n '1p')"
          if [[ "$package_line" != *"name='io.github.chenxiex.kff.debug'"* ]]; then
            echo "Debug APK package name does not match io.github.chenxiex.kff.debug" >&2
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kff-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
